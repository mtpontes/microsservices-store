spring.application.name=auth-ms
server.port=9094

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/accounts_service?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:9091/eureka
api.security.token.secret=${JWT_SECRET}
